server {
    listen 80;
    listen [::]:80;
    server_name uteroindonesia.com www.uteroindonesia.com;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/sitemap.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass uteroindonesia-php:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 30s;
    }

    location ~ ^/artikel/(?<article_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/article-page.php;
        fastcgi_param QUERY_STRING slug=$article_slug;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass uteroindonesia-php:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 20s;
    }

    location ~ ^/artikel/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/article-page.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass uteroindonesia-php:9000;
    }

    location ~ ^/api/(articles|categories)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass uteroindonesia-php:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 20s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
